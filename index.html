<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RADIUS electronics | Sergeli</title>
    <style>
        :root {
            --brand-orange: #E65C32; /* Точный цвет из вашего логотипа */
            --text-main: #FFFFFF;
            --text-secondary: #BBBBBB;
            --bg-main: #0A0A0A; /* Глубокий черный фон */
            --bg-secondary: #1A1A1A; /* Темно-серый для блоков */
            --border-color: #333333;
            --logo-bg: #E2FAF4; /* Светло-мятный круг из логотипа */
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            max-width: 480px;
            width: 100%;
            padding: 50px 20px;
            box-sizing: border-box;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Воссозданный логотип (CSS-вектор) */
        .logo-wrapper {
            width: 110px;
            height: 110px;
            background-color: var(--logo-bg);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .logo-inner {
            width: 74px;
            height: 74px;
            background-color: var(--brand-orange);
            border-radius: 50%;
            position: relative;
        }

        .logo-cut {
            position: absolute;
            width: 37px;
            height: 6px;
            background-color: var(--logo-bg);
            top: 50%;
            left: 50%;
            transform-origin: 0% 50%;
            transform: translateY(-50%) rotate(38deg);
        }

        h1 {
            margin: 0 0 32px 0;
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: var(--text-main);
        }

        .info-block {
            background-color: var(--bg-secondary);
            width: 100%;
            padding: 24px 20px;
            border-radius: 20px;
            margin-bottom: 32px;
            box-sizing: border-box;
            border: 1px solid var(--border-color);
        }

        .info-block p {
            margin: 6px 0;
            font-size: 15px;
            line-height: 1.5;
        }

        .info-block .highlight {
            font-weight: 700;
            font-size: 17px;
            color: var(--brand-orange);
            margin-bottom: 12px;
        }

        .info-block .specs {
            color: var(--text-secondary);
            font-size: 14px;
            margin-top: 12px;
            font-weight: 500;
        }

        .links-grid {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 18px 20px;
            background-color: var(--bg-main);
            color: var(--text-main);
            text-decoration: none;
            font-size: 16px;
            font-weight: 600;
            border-radius: 16px;
            border: 2px solid var(--border-color);
            box-sizing: border-box;
            transition: all 0.2s ease;
        }

        .btn:hover, .btn:active {
            border-color: var(--brand-orange);
            background-color: var(--bg-secondary);
            transform: translateY(-2px);
        }

        .btn-icon {
            margin-right: 12px;
            font-size: 20px;
        }

        .footer-address {
            margin-top: 40px;
            font-size: 13px;
            color: var(--text-secondary);
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Логотип, нарисованный кодом -->
        <div class="logo-wrapper">
            <div class="logo-inner">
                <div class="logo-cut"></div>
            </div>
        </div>
        
        <h1>RADIUS electronics</h1>

        <div class="info-block">
            <p class="highlight">Maishiy texnika va elektronika 🧡</p>
            <p>Uyingiz uchun zamonaviy texnika</p>
            <p class="specs">Muddatli to‘lov • Yetkazib berish • Kafolat</p>
        </div>

        <div class="links-grid">
            <a href="tel:+998777149430" class="btn">
                <span class="btn-icon">📞</span> Позвонить
            </a>
            
            <a href="https://t.me/RadiusSergeli" class="btn" target="_blank">
                <span class="btn-icon">💬</span> Написать в Telegram
            </a>
            
            <a href="#" class="btn" target="_blank">
                <span class="btn-icon">📢</span> Наш Telegram-канал
            </a>
            
            <a href="https://yandex.uz/maps/?text=Ташкент,+Сергелийский+район,+массив+Сергели-8A,+22" class="btn" target="_blank">
                <span class="btn-icon">📍</span> Построить маршрут
            </a>
        </div>

        <div class="footer-address">
            📍 Сергелийский район, массив Сергели-8A, 22
        </div>
    </div>
</body>
</html>
